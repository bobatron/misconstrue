# Runs on every push to main and every pull request: backend tests, frontend type-check/build/lint.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # The same word list the app uses to tell real words from names (see phonetics.py).
      - name: Install word list
        run: sudo apt-get update -q && sudo apt-get install -y -q wamerican
      - name: Install Python libraries
        run: pip install -r backend/requirements.txt
      - name: Download word lists (names and places, to keep them out of carriers)
        run: python -m nltk.downloader -q names gazetteers
      # The aligner (MFA, conda-only) and speech models aren't needed: tests cover the logic
      # around them, and planning falls back to CMUdict without MFA's dictionary.
      - name: Run tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Lint
        run: npx oxlint src
